# Upstream для бекенда
upstream backend {
    server backend:8000;
}

# Upstream для фронтенда
upstream frontend {
    server frontend:80;
}

# HTTP сервер (редирект на HTTPS)
server {
    listen 80;
    server_name _;

    # Редирект на HTTPS (раскомментируйте если настроен SSL)
    # return 301 https://$host$request_uri;

    # Или использовать HTTP (для разработки)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API запросы проксируем на бекенд
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличиваем таймауты для долгих запросов
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Статические файлы Django
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы Django
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Admin статика
    location /admin/static/ {
        alias /var/www/static/admin/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

