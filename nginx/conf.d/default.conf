server {
    listen 80;
    server_name skazkindomykt.ru www.skazkindomykt.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skazkindomykt.ru www.skazkindomykt.ru;

    ssl_certificate /etc/letsencrypt/live/skazkindomykt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skazkindomykt.ru/privkey.pem;

    root /opt/wood_store/apps/frontend/dist;
    index index.html;

    client_max_body_size 100M;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django static (admin, jazzmin)
    location /static/ {
        alias /opt/wood_store/apps/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Загруженные файлы
    location /media/ {
        alias /opt/wood_store/apps/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger|redoc)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
