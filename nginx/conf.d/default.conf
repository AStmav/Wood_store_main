map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|facebookexternalhit|twitterbot|linkedinbot|embedly|quora|pinterest|redditbot|applebot|semrush|ahrefs|dotbot|mj12bot|petalbot) 1;
}

server {
    listen 80;
    server_name skazkindomykt.ru www.skazkindomykt.ru;
    return 301 https://skazkindomykt.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.skazkindomykt.ru;
    ssl_certificate /etc/letsencrypt/live/skazkindomykt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skazkindomykt.ru/privkey.pem;
    return 301 https://skazkindomykt.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name skazkindomykt.ru;

    ssl_certificate /etc/letsencrypt/live/skazkindomykt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skazkindomykt.ru/privkey.pem;

    root /opt/wood_store/apps/frontend/dist;
    index index.html;

    client_max_body_size 100M;

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        alias /opt/wood_store/apps/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        gzip_static off;
    }

    error_page 418 = @bot_seo;

    location / {
        if ($is_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @bot_seo {
        proxy_pass http://127.0.0.1:8000/seo/render$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/wood_store/apps/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/wood_store/apps/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger|redoc)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
