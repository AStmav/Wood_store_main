server {
    listen 80;
    server_name skazkindomykt.ru www.skazkindomykt.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skazkindomykt.ru www.skazkindomykt.ru;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 🔹 FRONTEND
    location / {
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 Статические файлы Django
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 🔹 Медиа файлы Django (изображения продуктов, новостей и т.д.)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 🔹 Admin static (Jazzmin / Django Admin)
    location /admin/static/ {
        alias /var/www/static/admin/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 🔹 Admin panel (Django Jazzmin)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 Swagger / Redoc
    location ~ ^/(swagger|redoc)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🔹 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
