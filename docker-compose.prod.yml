version: '3.8'

# Production конфигурация с nginx reverse proxy
services:
  db:
    image: postgres:15
    container_name: wood_shop_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wood_shop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Не открываем порт в продакшене (только внутри сети)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wood_network

  redis:
    image: redis:7-alpine
    container_name: wood_shop_redis
    # Не открываем порт в продакшене (только внутри сети)
    volumes:
      - redis_data:/data
    # Используем переменную окружения напрямую
    # Если REDIS_PASSWORD пустой, Redis запустится без пароля
    command: >
      sh -c "
      if [ -z \"$$REDIS_PASSWORD\" ]; then
        echo 'WARNING: REDIS_PASSWORD is empty. Starting Redis without password.'
        redis-server
      else
        echo 'Starting Redis with password authentication...'
        redis-server --requirepass \"$$REDIS_PASSWORD\"
      fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: >
        sh -c "
        if [ -z \"$$REDIS_PASSWORD\" ]; then
          redis-cli ping || exit 1
        else
          redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1
        fi
        "
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wood_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: wood_shop_backend
    # Не открываем порт напрямую, доступ через nginx
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wood_shop}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: furniture_store.settings
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wood_network
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn furniture_store.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -"

  celery:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: wood_shop_celery
    command: celery -A furniture_store worker --loglevel=info --concurrency=4
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wood_shop}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: furniture_store.settings
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - wood_network

  celery-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: wood_shop_celery_beat
    command: celery -A furniture_store beat --loglevel=info
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wood_shop}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: furniture_store.settings
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - wood_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Для production не указываем VITE_API_URL - используем относительные пути
        # Для localhost development укажите: VITE_API_URL=http://localhost:8000
        # - VITE_API_URL=https://skazkindomykt.ru
    container_name: wood_shop_frontend
    # Не открываем порт напрямую, доступ через nginx
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - wood_network

  nginx:
    image: nginx:alpine
    container_name: wood_shop_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - wood_network

networks:
  wood_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

