<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сервис временно недоступен — Сказкин Дом</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      .card {
        max-width: 28rem;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 9999px;
        background: #eff6ff;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.75rem;
        color: #4b5563;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.6rem 1.25rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.875rem;
      }
      a:hover { background: #1d4ed8; }
      .hint {
        margin-top: 2rem;
        font-size: 0.875rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">!</div>
      <h1>Сервис временно недоступен</h1>
      <p>
        Сайт не может ответить прямо сейчас. Обновите страницу через минуту
        или зайдите позже.
      </p>
      <a href="/">Обновить / на главную</a>
      <p class="hint">Сказкин Дом</p>
    </div>
  </body>
</html>
